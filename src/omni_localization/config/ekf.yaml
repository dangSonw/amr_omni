### EKF Filter Configuration for AMR Omni (robot_localization)
### Fuses wheel odometry (wheel/odom) and IMU (imu/data) to produce /odometry/filtered and odom -> base_link TF

ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true
    sensor_timeout: 0.2
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: false
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    publish_tf: true
    publish_acceleration: false

    # Wheel Odometry input (vận tốc Vx, Vy từ 4x Encoders qua Kalman + Kinematics)
    # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0: wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # IMU input (BNO08x: góc Euler Yaw)
    # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    # Trong two_d_mode, góc Euler mặt phẳng là Yaw (index 5)
    imu0: imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

    # LiDAR Odometry input (Dự phòng chống trượt bánh Mecanum khi có lidar odometry)
    # odom1: odom_lidar
    # odom1_config: [false, false, false,
    #                false, false, true,
    #                true,  true,  false,
    #                false, false, true,
    #                false, false, false]
    # odom1_queue_size: 10
    # odom1_differential: false
    # odom1_relative: false

    use_control: false
