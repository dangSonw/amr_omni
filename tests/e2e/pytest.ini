[pytest]
testpaths = tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    tier1: Tier 1 Feature Coverage tests
    tier2: Tier 2 Boundary and Corner cases
    tier3: Tier 3 Cross-Feature Interaction tests
    tier4: Tier 4 Real-World Workload Scenarios
    wip: Work-in-progress features scheduled for implementation in M1-M4
addopts = -ra --strict-markers
